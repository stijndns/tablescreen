# Tablescreen configuration.
#
# Edit `enabled` to choose which features load. A disabled feature's code is
# never imported, its commands never appear, and its windows are never
# created — so running a non-D&D game is just a matter of removing "combat"
# from the list.

[features]
enabled = ["audiowindow", "combat", "battlemap"]

[features.audiowindow]
window = "mainscreen"

[features.combat]
window = "mainscreen"
text_scale = 1.0            # size of the combat screen's text (and so its rows)
layout = "single"           # single | double (two columns)

[features.battlemap]
window = "battlemap"
screen_diagonal_in = 50     # table TV, in inches
cell_size_in = 1.0
# pixels_per_inch = 88.1    # override if the measured grid is off
grid_color = "#ffffff"
grid_width = 1
coords_style = "letters"    # letters (E8) | numbers (5,8)
coords_location = "sides"   # sides | cells
# coords_color = "#ffffff"  # defaults to grid_color

[windows]
mainscreen = "800x600"
battlemap = "1200x900"