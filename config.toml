# Tablescreen configuration.
#
# Edit `enabled` to choose which features load. A disabled feature's code is
# never imported, its commands never appear, and its windows are never
# created — so running a non-D&D game is just a matter of removing "combat"
# from the list.

[features]
enabled = ["audiowindow", "combat", "battlemap"]

[features.audiowindow]
window = "mainscreen"

[features.combat]
window = "mainscreen"
text_scale = 1.5            # size of the combat screen's text (and so its rows)
layout = "single"           # single | double (two columns)

[features.battlemap]
window = "battlemap"
screen_diagonal_in = 50     # table TV, in inches
cell_size_in = 1.0
# pixels_per_inch = 88.1    # override if the measured grid is off
grid_color = "#ffffff"
grid_width = 1
coords_style = "letters"    # letters (E8) | numbers (5,8)
coords_location = "sides"   # sides | cells
# coords_color = "#ffffff"  # defaults to grid_color
aoe_hatching = true         # hatch lines inside areas of effect (false: outline only)

[api]
# The player webapp. Off unless enabled; the gateway (a separate program)
# connects to the app over the bridge below.
enabled = false
share = ["combat"]          # one webapp tab per feature listed here
bridge_host = "127.0.0.1"
bridge_port = 8765
secret_file = "api/bridge.secret"   # created on first start; the gateway reads it too
cert_file = "api/cert.pem"          # the gateway's HTTPS certificate (api cert new)
key_file = "api/key.pem"

[windows]
mainscreen = "800x600"
battlemap = "1200x900"