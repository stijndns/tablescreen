<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · Tablescreen</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/common.js" defer></script>
  <script src="/static/password.js" defer></script>
</head>
<body>
  <header class="bar">
    <h1>Tablescreen</h1>
  </header>
  <main>
    <form id="form" class="card">
      <h2>Change password</h2>
      <p id="first-time" class="notice" hidden>
        You're logged in with the password you were given. Choose your own before you continue.
      </p>
      <!-- Lets password managers store the new password under this name. -->
      <input id="user" name="user" autocomplete="username" hidden>
      <label>Current password
        <input name="current" type="password" autocomplete="current-password"
               maxlength="128" required>
      </label>
      <label>New password <span class="hint">(8 to 128 characters)</span>
        <input name="new" type="password" autocomplete="new-password"
               minlength="8" maxlength="128" required>
      </label>
      <label>New password again
        <input name="repeat" type="password" autocomplete="new-password"
               minlength="8" maxlength="128" required>
      </label>
      <p id="error" class="error" hidden></p>
      <p id="done" class="success" hidden>Your password is changed.</p>
      <nav class="actions">
        <button type="submit">Change password</button>
        <a id="back" class="button secondary" href="/" hidden>Back</a>
      </nav>
    </form>
  </main>
</body>
</html>
